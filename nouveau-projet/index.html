<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau projet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================================================================
     HEADER
     ================================================================ -->
<header>
  <div class="logo">Nouveau projet</div>
  <button onclick="toggleTheme()" title="Basculer le thème">Thème</button>
</header>

<!-- ================================================================
     FORMULAIRE D'AJOUT
     ================================================================ -->
<form class="panel" id="itemForm">
  <div class="form-row">
    <input id="inputName"        type="text"   placeholder="Nom"           required>
    <input id="inputDescription" type="text"   placeholder="Description">
    <input id="inputQuantity"    type="number" placeholder="Quantité" value="0" min="0">
    <button class="primary" type="submit">Ajouter</button>
  </div>
</form>

<!-- ================================================================
     LISTE
     ================================================================ -->
<div class="items" id="itemList"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/app.js"></script>
</body>
</html>
