<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16181d">
  <meta name="description" content="Gestion des clients, de l'agenda et des séances — LMT Coaching">
  <title>LMT Coaching</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LMT">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================================================================
     ÉCRAN DE CONNEXION
     ================================================================ -->
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm">
    <div class="login-logo">LMT</div>
    <h1>LMT Coaching</h1>
    <p class="muted">Accès réservé au coach.</p>
    <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="primary block" type="submit">Se connecter</button>
    <div class="login-error" id="loginError" hidden></div>
  </form>
</div>

<!-- ================================================================
     APPLICATION
     ================================================================ -->
<div id="shell" class="shell hidden">

  <header class="topbar">
    <div class="brand"><span class="brand-badge">LMT</span> <span id="topTitle">Agenda</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnTheme" title="Thème clair / sombre" aria-label="Thème">◐</button>
      <button class="icon-btn" id="btnLogout" title="Se déconnecter" aria-label="Déconnexion">⏻</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="app" class="app"><div class="loader">Chargement…</div></main>

  <nav class="tabbar">
    <a href="#/agenda"   class="tab" data-tab="agenda"><span class="tab-ico">▦</span>Agenda</a>
    <a href="#/clients"  class="tab" data-tab="clients"><span class="tab-ico">☰</span>Clients</a>
    <a href="#/alerts"   class="tab" data-tab="alerts"><span class="tab-ico">!</span>Alertes<span class="tab-badge" id="alertBadge" hidden>0</span></a>
    <a href="#/stats"    class="tab" data-tab="stats"><span class="tab-ico">▲</span>Suivi</a>
    <a href="#/settings" class="tab" data-tab="settings"><span class="tab-ico">⚙</span>Réglages</a>
  </nav>
</div>

<!-- Feuille modale (détail d'un cours, formulaires) -->
<div id="sheet" class="sheet-backdrop hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Détail</h2>
      <button class="icon-btn" id="sheetClose" aria-label="Fermer">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/agenda.js"></script>
<script src="js/views/session.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/client.js"></script>
<script src="js/views/alerts.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
