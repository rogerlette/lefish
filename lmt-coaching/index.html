<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16181d">
  <meta name="description" content="Gestion des clients, de l'agenda et des séances — LMT Coaching">
  <title>LMT Coaching</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LMT">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================================================================
     ÉCRAN DE CONNEXION
     ================================================================ -->
<div id="login" class="login hidden">
  <form class="login-card" id="loginForm">
    <div class="login-logo">LMT</div>
    <h1>LMT Coaching</h1>
    <p class="muted">Accès réservé au coach.</p>
    <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="primary block" type="submit">Se connecter</button>
    <div class="login-error" id="loginError" hidden></div>
  </form>
</div>

<!-- ================================================================
     APPLICATION
     ================================================================ -->
<div id="shell" class="shell hidden">

  <header class="topbar">
    <div class="brand"><span class="brand-badge">LMT</span> <span id="topTitle">Agenda</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnTheme" title="Thème clair / sombre" aria-label="Thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18zM12 3a9 9 0 010 18"/></svg></button>
      <button class="icon-btn" id="btnLogout" title="Se déconnecter" aria-label="Déconnexion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v9M18.4 6.6a9 9 0 11-12.8 0"/></svg></button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="app" class="app"><div class="loader">Chargement…</div></main>

  <nav class="tabbar">
    <a href="#/agenda"   class="tab" data-tab="agenda"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v16H3zM3 9.5h18M8 3v4M16 3v4"/></svg></span>Agenda</a>
    <a href="#/clients"  class="tab" data-tab="clients"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20a6 6 0 0112 0M10 4a4 4 0 110 8 4 4 0 010-8M17 20a5 5 0 00-3-4.6"/></svg></span>Clients</a>
    <a href="#/alerts"   class="tab" data-tab="alerts"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 016 6c0 5 2 6 2 6H4s2-1 2-6a6 6 0 016-6zM10 20a2 2 0 004 0"/></svg></span>Alertes<span class="tab-badge" id="alertBadge" hidden>0</span></a>
    <a href="#/stats"    class="tab" data-tab="stats"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Suivi</a>
    <a href="#/settings" class="tab" data-tab="settings"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9.2a2.8 2.8 0 100 5.6 2.8 2.8 0 000-5.6M19.2 15a1.5 1.5 0 00.3 1.7l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.5 1.5 0 00-2.6 1V21a2 2 0 11-4 0v-.2a1.5 1.5 0 00-2.6-1l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.5 1.5 0 00-1-2.6H3a2 2 0 110-4h.2a1.5 1.5 0 001-2.6l-.1-.1a2 2 0 112.8-2.8l.1.1a1.5 1.5 0 002.6-1V3a2 2 0 114 0v.2a1.5 1.5 0 002.6 1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.5 1.5 0 001 2.6H21a2 2 0 110 4h-.2a1.5 1.5 0 00-1.6 1z"/></svg></span>Réglages</a>
  </nav>
</div>

<!-- Feuille modale (détail d'un cours, formulaires) -->
<div id="sheet" class="sheet-backdrop hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Détail</h2>
      <button class="icon-btn" id="sheetClose" aria-label="Fermer">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/vcard.js"></script>
<script src="js/views/agenda.js"></script>
<script src="js/views/session.js"></script>
<script src="js/views/clients.js"></script>
<script src="js/views/client.js"></script>
<script src="js/views/alerts.js"></script>
<script src="js/views/stats.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
