<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AquaStock — Carte des bassins</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>

<!-- HEADER -->
<header>
  <div class="map-header-left">
    <a href="index.html" class="back-btn" title="Retour aux lots">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="logo">
      <div class="logo-badge" style="background:white;border:1px solid var(--border);padding:2px;width:36px;height:36px">
        <img id="logoImg" alt="Charles Murgat" style="width:100%;height:100%;object-fit:contain;">
      </div>
      Carte des bassins
    </div>
  </div>
  <div class="map-header-right">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomInBtn" title="Zoom +">+</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button class="zoom-btn" id="zoomOutBtn" title="Zoom −">−</button>
    </div>
    <button class="zoom-btn" id="resetBtn" title="Recentrer">⌂</button>
  </div>
</header>

<!-- CANVAS MAP -->
<div class="map-container" id="mapContainer">
  <canvas id="mapCanvas"></canvas>
</div>

<!-- LOT DETAIL PANEL (slide-up) -->
<div class="lot-panel" id="lotPanel">
  <div class="lot-panel-handle"></div>
  <div class="lot-panel-header">
    <div>
      <div class="lot-panel-code" id="panelCode">—</div>
      <div class="lot-panel-subtitle" id="panelSubtitle">—</div>
    </div>
    <button class="lot-panel-close" id="panelClose">✕</button>
  </div>
  <div class="lot-panel-body" id="panelBody">
    <div class="lot-panel-empty">Aucun lot assigné</div>
  </div>
  <div class="lot-panel-actions">
    <a class="btn-panel-link" id="panelLink" href="index.html">Voir dans AquaStock</a>
  </div>
</div>

<!-- MINIMAP -->
<div class="minimap-wrap" id="minimapWrap">
  <canvas id="minimapCanvas" width="160" height="100"></canvas>
</div>

<script src="js/logo.js"></script>
<script src="js/map.js"></script>
<script>
  document.getElementById('logoImg').src = LOGO_B64_DATA;
</script>
</body>
</html>
